# /etc/apache2/sites-available/yct.l0g.fr.conf
# Modules requis : a2enmod ssl headers rewrite

<VirtualHost *:80>
    ServerName yct.l0g.fr

    # Laisser passer le challenge ACME (renouvellement certbot webroot)
    Alias /.well-known/acme-challenge/ /var/www/html/yct/.well-known/acme-challenge/
    <Directory "/var/www/html/yct/.well-known/acme-challenge/">
        Require all granted
    </Directory>

    # Tout le reste en HTTPS
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName yct.l0g.fr
    DocumentRoot /var/www/html/yct

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/yct.l0g.fr/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/yct.l0g.fr/privkey.pem
    # Ajuste si besoin a ta conf TLS globale (Mozilla intermediate recommande)
    SSLProtocol            -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder    off
    SSLSessionTickets      off

    # --- Fichiers statiques de l'app ---
    <Directory "/var/www/html/yct">
        Options -Indexes -ExecCGI -Includes +SymLinksIfOwnerMatch
        AllowOverride None
        Require all granted
    </Directory>

    # --- Snapshot servi depuis un chemin inscriptible HORS web root ---
    Alias /data.json /var/lib/yct/data.json
    <Directory "/var/lib/yct">
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    <Files "data.json">
        Header set Cache-Control "public, max-age=300, must-revalidate"
    </Files>

    # --- En-tetes de securite ---
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), browsing-topics=()"
    Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"

    ErrorLog  ${APACHE_LOG_DIR}/yct_error.log
    CustomLog ${APACHE_LOG_DIR}/yct_access.log combined
</VirtualHost>
