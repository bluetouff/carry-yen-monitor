name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python syntax and unit tests
        run: |
          python -m py_compile build_snapshot.py yct_quality.py verify_snapshot.py verify_live.py gen_sample.py tools/release.py tests/test_yct.py
          python -m unittest discover -s tests -v
      - name: Browser JavaScript syntax
        if: matrix.python-version == '3.14'
        run: |
          node --check web/app.js
          bash -n deploy/activate-release.sh
          systemd-analyze verify deploy/yct-snapshot.service deploy/yct-snapshot.timer
      - name: Exact release artifact and secret guard
        if: matrix.python-version == '3.14'
        run: |
          sha=$(git rev-parse HEAD)
          python tools/release.py build --output /tmp/yct-dist
          python tools/release.py verify-archive --archive "/tmp/yct-dist/yct-release-${sha}.tar.gz" --expected-sha "$sha"
      - name: Demo snapshot generation
        if: matrix.python-version == '3.14'
        run: python gen_sample.py
